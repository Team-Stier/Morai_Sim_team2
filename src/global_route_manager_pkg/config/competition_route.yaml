expected_length_m: 2184.612
length_tolerance_m: 0.1
closure_tolerance_m: 0.05
require_closed_route: true

publish_rate_hz: 20.0
odometry_timeout_sec: 0.20
horizon_link_count: 6

matcher:
  # Adjacent-lane driving can be about 3.5 m from the official reference path,
  # while larger jumps are rejected instead of globally reacquiring mid-run.
  max_lateral_distance_m: 6.0
  search_backward_segments: 20
  search_forward_segments: 200
  max_heading_error_deg: 100.0
  heading_weight_m2_per_rad2: 1.0

