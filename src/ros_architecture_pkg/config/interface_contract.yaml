external_transport:
  owner_package: morai_interface_pkg
  policy: official_competition_allowlist_only
  allowed_logical_channels:
    - Ego Ctrl Cmd
    - CollisionData
    - Competition Vehicle Status
    - GPS sensor
    - IMU sensor
    - Camera sensor
    - 3D LiDAR sensor
  diagram_bindings:
    ingress:
      label: MORAI Simulator allowed sensor and event UDP
      logical_channels:
        - CollisionData
        - Competition Vehicle Status
        - GPS sensor
        - IMU sensor
        - Camera sensor
        - 3D LiDAR sensor
      adapter_nodes:
        - morai_camera_front
        - morai_camera_left
        - morai_camera_right
        - morai_gps_bridge
        - morai_imu_bridge
        - morai_vehicle_status_bridge
        - morai_velodyne_driver
        - morai_collision_bridge
    egress:
      label: MORAI Simulator Ego Ctrl Cmd UDP type 1 mode 2
      logical_channels:
        - Ego Ctrl Cmd
      adapter_nodes:
        - morai_control_sender
  control_constraints:
    command_type: 1
    control_mode: 2
    final_command_consumer_gate:
      owner_node: morai_control_sender
      enable_status: prohibited_until_control_packet_and_watchdog_timeout_are_verified
      required_checks:
        - reject_zero_regressing_future_or_expired_command_stamp
        - reject_nan_and_out_of_range_fields
        - never_repeat_the_last_nonzero_command_after_input_loss
        - serialize_only_a_packet_verified_fail_closed_stop_on_timeout
