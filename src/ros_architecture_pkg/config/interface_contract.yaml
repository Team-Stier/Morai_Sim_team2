schema_version: 1
contract_version: 0.3.0
status: approved_morai_sensor_localization_and_path_control_test

authority:
  package: ros_architecture_pkg
  rule: >-
    This file is the sole authority for public ROS interfaces. A name absent
    from this file or an explicitly scoped vendor runtime profile is not
    approved, including temporary and visualization names.

nodes:
  - name: /morai_gps_bridge
    owner_package: morai_interface_pkg
    responsibility: validate MORAI GPS NMEA UDP and publish canonical fixes
  - name: /morai_imu_bridge
    owner_package: morai_interface_pkg
    responsibility: validate MORAI IMU UDP and publish canonical inertial observations
  - name: /morai_vehicle_status_bridge
    owner_package: morai_interface_pkg
    responsibility: validate MORAI Competition Vehicle Status UDP and publish canonical ego twist
  - name: /morai_camera_front
    owner_package: morai_interface_pkg
    responsibility: reassemble front MORAI camera UDP chunks into compressed images
  - name: /morai_camera_left
    owner_package: morai_interface_pkg
    responsibility: reassemble left MORAI camera UDP chunks into compressed images
  - name: /morai_camera_right
    owner_package: morai_interface_pkg
    responsibility: reassemble right MORAI camera UDP chunks into compressed images
  - name: /molit_local_ekf
    owner_package: localization_pkg
    responsibility: estimate continuous odom-frame ego motion from IMU and vehicle twist
  - name: /molit_global_ekf
    owner_package: localization_pkg
    responsibility: estimate map-referenced ego state from GPS pose, IMU, and vehicle twist
  - name: /molit_gps_projector
    owner_package: localization_pkg
    responsibility: validate GPS fixes and project them into the approved map frame
  - name: /molit_localization_supervisor
    owner_package: localization_pkg
    responsibility: gate localization freshness and publish the canonical fail-closed ego estimate
  - name: /hd_map/rviz_map
    owner_package: hd_map_pkg
    responsibility: publish immutable MGeo lane-boundary visualization
  - name: /planning/global_route_manager
    owner_package: global_route_manager_pkg
    responsibility: publish the official route and monotonic ego route context
  - name: /planning/hybrid_astar
    owner_package: path_planning_pkg
    responsibility: publish a fail-closed local trajectory inside the selected map corridor
  - name: /runtime/planning_visualizer
    owner_package: runtime_evaluation_pkg
    responsibility: visualize ego footprint and bounded odometry history without affecting planning
  - name: /planning/rviz
    owner_package: system_bringup_pkg
    responsibility: optional visualization-only RViz process with no command-path output
  - name: /control_test/team1/trajectory_adapter
    owner_package: vehicle_control_pkg
    responsibility: convert fresh valid canonical trajectory and odometry into isolated Team1 compatibility inputs and fail closed otherwise
  - name: /control_test/team1/path_tracking_controller_node
    owner_package: morai_path_tracking
    responsibility: run the pinned Team1 path tracker for isolated open-loop comparison without UDP transmission

topics:
  - name: /sensors/gps/fix
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [localization_pkg]
    data_meaning: validated MORAI GPS fix without route or ground-truth substitution
    data_type: sensor_msgs/NavSatFix
    unit: latitude=deg; longitude=deg; altitude=m; covariance=m2
    frame: gps_link
    timestamp_source: local ROS receipt time after complete UDP packet validation
    expected_rate_hz: 30.0
    queue_policy: keep_last_10_drop_oldest
    timeout_sec: 0.75
    invalid_data_policy: reject malformed or non-finite packets and expose loss through freshness timeout

  - name: /sensors/imu/data
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [localization_pkg]
    data_meaning: validated MORAI body-frame orientation, angular velocity, and linear acceleration
    data_type: sensor_msgs/Imu
    unit: orientation=quaternion; angular_velocity=rad/s; linear_acceleration=m/s2
    frame: base_link
    timestamp_source: local ROS receipt time after complete UDP packet validation
    expected_rate_hz: 50.0
    queue_policy: keep_last_20_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: reject malformed, non-finite, or non-unit orientation samples and require localization degradation on timeout

  - name: /vehicle/twist
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [localization_pkg]
    data_meaning: validated ego linear and angular velocity from Competition Vehicle Status
    data_type: geometry_msgs/TwistWithCovarianceStamped
    unit: linear_velocity=m/s; angular_velocity=rad/s; covariance=SI
    frame: base_link
    timestamp_source: local ROS receipt time after complete UDP packet validation
    expected_rate_hz: 50.0
    queue_policy: keep_last_10_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: reject wrong-size, malformed, or non-finite packets and require localization degradation on timeout

  - name: /sensors/camera/front/image/compressed
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [camera_perception_pkg, rosbag]
    data_meaning: reassembled compressed image from the front competition camera
    data_type: sensor_msgs/CompressedImage
    unit: JPEG byte stream
    frame: camera_front
    timestamp_source: local ROS completion time of the validated UDP frame
    expected_rate_hz: 30.0
    queue_policy: keep_last_2_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: discard incomplete, stale, out-of-order, or malformed frame chunks

  - name: /sensors/camera/left/image/compressed
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [camera_perception_pkg, rosbag]
    data_meaning: reassembled compressed image from the left competition camera
    data_type: sensor_msgs/CompressedImage
    unit: JPEG byte stream
    frame: camera_left
    timestamp_source: local ROS completion time of the validated UDP frame
    expected_rate_hz: 30.0
    queue_policy: keep_last_2_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: discard incomplete, stale, out-of-order, or malformed frame chunks

  - name: /sensors/camera/right/image/compressed
    owner_package: morai_interface_pkg
    producers: [morai_interface_pkg]
    consumers: [camera_perception_pkg, rosbag]
    data_meaning: reassembled compressed image from the right competition camera
    data_type: sensor_msgs/CompressedImage
    unit: JPEG byte stream
    frame: camera_right
    timestamp_source: local ROS completion time of the validated UDP frame
    expected_rate_hz: 30.0
    queue_policy: keep_last_2_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: discard incomplete, stale, out-of-order, or malformed frame chunks

  - name: /localization/gps/map_pose
    owner_package: localization_pkg
    producers: [localization_pkg]
    consumers: [localization_pkg]
    data_meaning: gated GPS position projected into the MORAI scene ENU map frame
    data_type: geometry_msgs/PoseWithCovarianceStamped
    unit: position=m; orientation=quaternion; covariance=SI
    frame: map
    timestamp_source: accepted GPS fix timestamp
    expected_rate_hz: 30.0
    queue_policy: keep_last_5_drop_oldest
    timeout_sec: 0.75
    invalid_data_policy: suppress invalid or unstable reacquisition fixes and never replay the last fix as current

  - name: /localization/local/odometry
    owner_package: localization_pkg
    producers: [localization_pkg]
    consumers: [localization_pkg]
    data_meaning: continuous local EKF motion estimate used only inside localization supervision
    data_type: nav_msgs/Odometry
    unit: position=m; linear_velocity=m/s; angular_velocity=rad/s; covariance=SI
    frame: odom -> base_link
    timestamp_source: robot_localization filter time in ROS time
    expected_rate_hz: 20.0
    queue_policy: keep_last_5_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: supervisor rejects missing, stale, future, non-finite, or wrong-frame samples

  - name: /localization/global/odometry
    owner_package: localization_pkg
    producers: [localization_pkg]
    consumers: [localization_pkg]
    data_meaning: map-referenced global EKF estimate used only inside localization supervision
    data_type: nav_msgs/Odometry
    unit: position=m; linear_velocity=m/s; angular_velocity=rad/s; covariance=SI
    frame: map -> base_link
    timestamp_source: robot_localization filter time in ROS time
    expected_rate_hz: 20.0
    queue_policy: keep_last_5_drop_oldest
    timeout_sec: 0.50
    invalid_data_policy: supervisor rejects missing, stale, future, non-finite, or wrong-frame samples

  - name: /localization/odometry
    owner_package: localization_pkg
    producers: [localization_pkg]
    consumers: [global_route_manager_pkg, path_planning_pkg, vehicle_control_pkg, runtime_evaluation_pkg]
    data_meaning: rear-axle-centred ego pose and twist estimate in the MORAI scene ENU map frame
    data_type: nav_msgs/Odometry
    unit: position=m; linear_velocity=m/s; angular_velocity=rad/s; covariance=SI
    frame: map -> base_link
    timestamp_source: localization estimate time in ROS time
    expected_rate_hz: 30.0
    queue_policy: keep_last_5_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: reject non-finite, wrong-frame, future, or stale samples and require stop

  - name: /world_model/lead_vehicle
    owner_package: world_model_pkg
    producers: [world_model_pkg]
    consumers: [path_planning_pkg]
    data_meaning: fused same-lane leading vehicle and bumper-to-bumper longitudinal gap
    data_type: common_msgs_pkg/LeadVehicleState
    unit: pose=m,rad; twist=m/s,rad/s; dimensions=m; gap=m; confidence=ratio
    frame: map
    timestamp_source: time-aligned world-model estimate time in ROS time
    expected_rate_hz: 20.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.30
    invalid_data_policy: missing, malformed, future, stale, odometry-skewed, or current-link-mismatched input requires stop; a fresh finite valid=false heartbeat is the only no-lead representation; never authorize a new lane change from invalid data, and an active crossing must finish or request stop

  - name: /planning/global_path
    owner_package: global_route_manager_pkg
    producers: [global_route_manager_pkg]
    consumers: [path_planning_pkg, runtime_evaluation_pkg, rviz]
    data_meaning: immutable ordered competition reference route for navigation and visualization, not localization ground truth
    data_type: nav_msgs/Path
    unit: position=m; orientation=quaternion
    frame: map
    timestamp_source: publication time in ROS time
    expected_rate_hz: 0.0
    queue_policy: latched_keep_last_1
    timeout_sec: 0.0
    invalid_data_policy: missing, malformed, or mismatched-frame route makes route context invalid

  - name: /planning/route_context
    owner_package: global_route_manager_pkg
    producers: [global_route_manager_pkg]
    consumers: [path_planning_pkg, runtime_evaluation_pkg]
    data_meaning: ego progress and ordered MGeo link horizon on the approved global route
    data_type: common_msgs_pkg/RouteContext
    unit: progress=m; route_length=m; route_index=count
    frame: map
    timestamp_source: timestamp of the accepted odometry sample when valid=true; publication time in ROS time when valid=false
    expected_rate_hz: 20.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.25
    invalid_data_policy: publish valid=false and require downstream stop; never reuse stale progress as current

  - name: /planning/trajectory
    owner_package: path_planning_pkg
    producers: [path_planning_pkg]
    consumers: [vehicle_control_pkg, safety_supervisor_pkg, runtime_evaluation_pkg]
    data_meaning: dense constant-curvature samples of the currently validated local motion plan
    data_type: common_msgs_pkg/PlannedTrajectory
    unit: position=m; yaw=rad; curvature=1/m; arc_length=m; speed=m/s
    frame: map
    timestamp_source: time the planner accepted its input snapshot and started the search; fail-closed publication time when no result is exposed
    expected_rate_hz: 2.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.75
    invalid_data_policy: non-VALID status, empty points, expiry, wrong frame, or stale data requires stop

  - name: /planning/local_path
    owner_package: path_planning_pkg
    producers: [path_planning_pkg]
    consumers: [runtime_evaluation_pkg, rviz]
    data_meaning: visualization-only pose projection of the validated local trajectory
    data_type: nav_msgs/Path
    unit: position=m; orientation=quaternion
    frame: map
    timestamp_source: same snapshot anchor as /planning/trajectory
    expected_rate_hz: 2.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.75
    invalid_data_policy: publish an empty path when trajectory is invalid; never use for control

  - name: /control_test/team1/local_path
    owner_package: vehicle_control_pkg
    producers: [vehicle_control_pkg]
    consumers: [morai_path_tracking, rviz]
    data_meaning: Team1-only path projection of a still-valid canonical planned trajectory synchronized to accepted odometry
    data_type: nav_msgs/Path
    unit: position=m; orientation=quaternion
    frame: map
    timestamp_source: timestamp of the accepted canonical odometry sample used for this projection
    expected_rate_hz: 30.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: publish an empty synchronized path for invalid, empty, expired, future, stale, wrong-frame, or non-finite input and require safe brake

  - name: /control_test/team1/odometry
    owner_package: vehicle_control_pkg
    producers: [vehicle_control_pkg]
    consumers: [morai_path_tracking]
    data_meaning: controller-only copy of accepted canonical rear-axle odometry paired exactly with the compatibility path
    data_type: nav_msgs/Odometry
    unit: position=m; linear_velocity=m/s; angular_velocity=rad/s; covariance=SI
    frame: map -> base_link
    timestamp_source: unchanged timestamp of the accepted canonical odometry sample
    expected_rate_hz: 30.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: suppress non-finite, wrong-frame, future, or stale input; republish only the latest still-fresh accepted sample with an empty path to request safe brake

  - name: /control_test/team1/vehicle_status
    owner_package: vehicle_control_pkg
    producers: [vehicle_control_pkg]
    consumers: [morai_path_tracking]
    data_meaning: test-only base-link longitudinal speed projection from canonical odometry and not simulator Competition Vehicle Status
    data_type: common_msgs_pkg/ControllerVehicleState
    unit: linear_velocity=m/s
    frame: base_link
    timestamp_source: timestamp of the accepted canonical odometry sample
    expected_rate_hz: 30.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: suppress non-finite, wrong-frame, future, or stale odometry and require safe brake without reusing prior speed

  - name: /control_test/team1/raw_actuator_command
    owner_package: morai_path_tracking
    producers: [morai_path_tracking]
    consumers: [vehicle_control_pkg]
    data_meaning: unsupervised Team1 nominal command for isolated open-loop comparison and never a final or MORAI-transmittable command
    data_type: common_msgs_pkg/RawActuatorCommand
    unit: accel=normalized_ratio; brake=normalized_ratio; steering_angle=rad
    frame: base_link
    timestamp_source: Team1 controller execution time in ROS time
    expected_rate_hz: 30.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: reject missing, future, stale, non-finite, out-of-range, or simultaneous positive accel and brake and never forward to the MORAI command path

  - name: /control_test/team1/controller_status
    owner_package: morai_path_tracking
    producers: [morai_path_tracking]
    consumers: [rostopic]
    data_meaning: Team1 controller state, tracking errors, model diagnostics, targets, and emitted actuator values for isolated evaluation
    data_type: common_msgs_pkg/Team1ControllerStatus
    unit: position=m; angle=rad; speed=m/s; yaw_rate=rad/s; curvature=1/m; probability=ratio; actuator=normalized_ratio
    frame: base_link
    timestamp_source: Team1 controller execution time in ROS time
    expected_rate_hz: 30.0
    queue_policy: keep_last_10_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: stale, malformed, or non-finite diagnostics have no command authority and mark the comparison invalid

  - name: /control_test/team1/lookahead_point
    owner_package: morai_path_tracking
    producers: [morai_path_tracking]
    consumers: [rviz]
    data_meaning: visualization-only Team1 Pure Pursuit lookahead point in the ego body frame
    data_type: geometry_msgs/PointStamped
    unit: position=m
    frame: base_link
    timestamp_source: Team1 controller execution time in ROS time
    expected_rate_hz: 30.0
    queue_policy: keep_last_10_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: suppress when control is inactive or the target is invalid and never use for command generation

  - name: /control_test/team1/stanley_projection_point
    owner_package: morai_path_tracking
    producers: [morai_path_tracking]
    consumers: [rviz]
    data_meaning: visualization-only Team1 Stanley front-axle projection point in the ego body frame
    data_type: geometry_msgs/PointStamped
    unit: position=m
    frame: base_link
    timestamp_source: Team1 controller execution time in ROS time
    expected_rate_hz: 30.0
    queue_policy: keep_last_10_drop_oldest
    timeout_sec: 0.20
    invalid_data_policy: suppress when control is inactive or the projection is invalid and never use for command generation

  - name: /hd_map/markers
    owner_package: hd_map_pkg
    producers: [hd_map_pkg]
    consumers: [rviz]
    data_meaning: visualization-only source solid, dashed, mixed, road-border, and other map boundary geometry
    data_type: visualization_msgs/MarkerArray
    unit: position=m; line_width=m; color=normalized_rgba
    frame: map
    timestamp_source: publication time in ROS time
    expected_rate_hz: 0.0
    queue_policy: latched_keep_last_1
    timeout_sec: 0.0
    invalid_data_policy: suppress incomplete marker set and log an error; planning reads validated static map data directly

  - name: /planning/corridor_markers
    owner_package: path_planning_pkg
    producers: [path_planning_pkg]
    consumers: [rviz]
    data_meaning: visualization-only active hard walls, conditionally opened walls, and corridor polygons
    data_type: visualization_msgs/MarkerArray
    unit: position=m; line_width=m; color=normalized_rgba
    frame: map
    timestamp_source: same snapshot anchor as /planning/trajectory
    expected_rate_hz: 2.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.75
    invalid_data_policy: clear dynamic markers when planner snapshot is invalid

  - name: /planning/ego_trace
    owner_package: runtime_evaluation_pkg
    producers: [runtime_evaluation_pkg]
    consumers: [rviz]
    data_meaning: bounded visualization-only history of accepted ego odometry poses
    data_type: nav_msgs/Path
    unit: position=m; orientation=quaternion
    frame: map
    timestamp_source: timestamp of newest accepted odometry sample
    expected_rate_hz: 20.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.25
    invalid_data_policy: stop extending the trace and clear the vehicle marker after timeout

  - name: /planning/vehicle_marker
    owner_package: runtime_evaluation_pkg
    producers: [runtime_evaluation_pkg]
    consumers: [rviz]
    data_meaning: visualization-only IONIQ 5 body envelope at the rear-axle-centred odometry pose
    data_type: visualization_msgs/Marker
    unit: position=m; dimensions=m; color=normalized_rgba
    frame: map
    timestamp_source: timestamp of the accepted odometry sample
    expected_rate_hz: 20.0
    queue_policy: keep_last_1_drop_oldest
    timeout_sec: 0.25
    invalid_data_policy: publish DELETE after timeout; never feed the planning or command path

messages:
  - name: common_msgs_pkg/RouteContext
    owner_package: common_msgs_pkg
    meaning: validity, monotonic route progress, current MGeo link horizon, and speed-exception context
    invalid_representation: valid=false with no usable current or horizon link
  - name: common_msgs_pkg/LeadVehicleState
    owner_package: common_msgs_pkg
    meaning: fused leading-vehicle pose, size, velocity, lane identity, confidence, and longitudinal gap
    invalid_representation: valid=false; NaN is never an invalid sentinel
  - name: common_msgs_pkg/TrajectoryPoint
    owner_package: common_msgs_pkg
    meaning: one rear-axle-centred dense trajectory sample in map coordinates
    invalid_representation: enclosing trajectory status is non-VALID
  - name: common_msgs_pkg/PlannedTrajectory
    owner_package: common_msgs_pkg
    meaning: expiring local trajectory plus fail-closed status, reason, and minimum wheel-to-map-boundary clearance
    invalid_representation: status other than STATUS_VALID or current time after valid_until
  - name: common_msgs_pkg/ControllerVehicleState
    owner_package: common_msgs_pkg
    meaning: Team1 compatibility input carrying base-link longitudinal speed derived from accepted canonical odometry
    invalid_representation: zero, future, stale, wrong-frame, non-finite, or non-canonical-source data
  - name: common_msgs_pkg/RawActuatorCommand
    owner_package: common_msgs_pkg
    meaning: raw unsupervised Team1 acceleration, brake, and steering-angle output used only inside the isolated test profile
    invalid_representation: zero, future, stale, wrong-frame, non-finite, out-of-range, or simultaneous positive acceleration and brake
  - name: common_msgs_pkg/Team1ControllerStatus
    owner_package: common_msgs_pkg
    meaning: diagnostic state and intermediate values from the pinned Team1 tracking controller
    invalid_representation: inactive, zero, future, stale, wrong-frame, malformed, or non-finite data

services: []
actions: []
frames:
  - name: map
    owner_package: localization_pkg
    parent: null
    convention: MORAI scene-local ENU; x=east, y=north, z=up; yaw=0 east and positive counter-clockwise
    unit: m,rad
  - name: odom
    owner_package: localization_pkg
    parent: map
    convention: locally continuous ENU frame whose map relation may be corrected by global localization
    unit: m,rad
  - name: base_link
    owner_package: localization_pkg
    parent: odom
    convention: origin at rear-wheel midpoint; x=forward, y=left, z=up
    unit: m,rad
  - name: gps_link
    owner_package: morai_interface_pkg
    parent: base_link
    convention: GPS measurement frame fixed to the competition sensor mounting point
    unit: m,rad
  - name: camera_front
    owner_package: morai_interface_pkg
    parent: base_link
    convention: front competition camera optical mounting frame
    unit: m,rad
  - name: camera_left
    owner_package: morai_interface_pkg
    parent: base_link
    convention: left competition camera optical mounting frame
    unit: m,rad
  - name: camera_right
    owner_package: morai_interface_pkg
    parent: base_link
    convention: right competition camera optical mounting frame
    unit: m,rad

parameters:
  - name: /hd_map/rviz_map/map_source_directory
    owner_package: hd_map_pkg
    data_type: string
    unit: filesystem_path
    default: vendor/verdict_sdk/map-data/KATRI
  - name: /hd_map/rviz_map/map_config_file
    owner_package: hd_map_pkg
    data_type: string
    unit: filesystem_path
    default: config/map_conversion.yaml
  - name: /planning/global_route_manager/route_file
    owner_package: global_route_manager_pkg
    data_type: string
    unit: filesystem_path
    default: reference_file_from_hd_map_config
  - name: /planning/global_route_manager/route_config_file
    owner_package: global_route_manager_pkg
    data_type: string
    unit: filesystem_path
    default: config/competition_route.yaml
  - name: /planning/hybrid_astar/planner_config_file
    owner_package: path_planning_pkg
    data_type: string
    unit: filesystem_path
    default: config/hybrid_astar.yaml
  - name: /planning/hybrid_astar/map_source_directory
    owner_package: path_planning_pkg
    data_type: string
    unit: filesystem_path
    default: hd_map_pkg KATRI MGeo source
  - name: /planning/hybrid_astar/map_config_file
    owner_package: path_planning_pkg
    data_type: string
    unit: filesystem_path
    default: hd_map_pkg config/map_conversion.yaml
  - name: /control_test/team1/trajectory_adapter/adapter_config_file
    owner_package: vehicle_control_pkg
    data_type: string
    unit: filesystem_path
    default: vehicle_control_pkg config/team1_adapter.yaml

vendor_runtime_profiles:
  - name: /control_test/team1/path_tracking_controller_node
    owner_package: vehicle_control_pkg
    source_package: morai_path_tracking
    source_revision: 11c076b2e464697d86c76f968999cec58d0ffd69
    config_file: vehicle_control_pkg/config/team1_molit_2026_path_tracking.yaml
    private_parameter_policy: exact pinned upstream YAML plus launch-time safety and topic overrides; no downstream package may depend on these private names
    network_policy: no vendored UDP receiver or sender may run in this profile

required_interface_fields:
  - owner_package
  - producers
  - consumers
  - data_meaning
  - data_type
  - unit
  - frame
  - timestamp_source
  - expected_rate_hz
  - queue_policy
  - timeout_sec
  - invalid_data_policy

external_transport:
  owner_package: morai_interface_pkg
  policy: official_competition_allowlist_only
  allowed_logical_channels:
    - Ego Ctrl Cmd
    - CollisionData
    - Competition Vehicle Status
    - GPS sensor
    - IMU sensor
    - Camera sensor
    - 3D LiDAR sensor
  control_constraints:
    command_type: 1
    control_mode: 2
