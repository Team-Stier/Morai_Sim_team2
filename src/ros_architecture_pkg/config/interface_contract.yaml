schema_version: 2
contract_version: 1.0.0
status: public_names_approved_runtime_implementation_partial

authority:
  package: ros_architecture_pkg
  rule: >-
    This file is the single source of truth for every public ROS node, topic,
    message type, producer and consumer. Package READMEs and diagrams are
    projections of this contract and must not redefine it.

public_interface_policy:
  topic_namespace: /molit
  internal_topic_namespace_template: /molit/internal/<package_name_without_pkg>/...
  integrated_launch_node_namespace: /
  node_entries_are_basenames_under_integrated_namespace: true
  integrated_launch_node_names_are_exact: true
  public_topic_remap_allowed: false
  public_node_remap_allowed: false
  single_producer_per_topic: true
  package_internal_implementation: free_within_owned_internal_namespace
  rules:
    - External packages connect only through topics listed in package_boundaries.
    - Internal nodes and topics must not be consumed directly by another package.
    - A public name or type change starts here and updates every producer and consumer together.
    - Only safety_supervisor_node may produce /molit/safety/final_command.
    - Only morai_control_sender may send the approved final command to MORAI.
    - Runtime evaluation is read-only and cannot appear in a command-producing path.

runtime_evidence_policy:
  expected_rate_hz: design_or_configured_target_until_runtime_measured
  numeric_rate_is_not_live_rate_evidence: true
  pending_timeout_rule: measure_source_period_jitter_and_processing_latency_before_approval
  reserved_name_is_not_implementation_evidence: true

planning_policy:
  planner_class: modular_behavior_and_motion_planner
  owner_package: path_planning_pkg
  public_boundary_node: path_planner_node
  implementation_status: reserved_not_implemented
  input_groups:
    localization:
      - /molit/localization/local/odometry
      - /molit/localization/ego_state
      - /molit/localization/status
    route:
      - /molit/route/context
      - /molit/route/status
    world_model:
      - /molit/world_model/scene
      - /molit/world_model/status
  approved_public_outputs:
    trajectory:
      topic: /molit/planning/trajectory
      frame: odom
    status:
      topic: /molit/planning/status
      frame: not_applicable
  direct_actuator_output_allowed: false
  rules:
    - Path Planning consumes only approved Localization, Route and World Model public topics.
    - Raw Camera and LiDAR inputs remain owned by their sensor and perception packages.
    - Planning reports input validity, replanning state and trajectory validity on planning status.
    - Path Planning never bypasses vehicle_controller_node or safety_supervisor_node.

runtime_readiness_policy:
  status: semantics_approved_required_channel_sets_pending_runtime_validation
  rules:
    - A channel with runtime_activation_allowed false cannot be required by an active bringup profile.
    - Required and optional channel sets must be explicit in each system_bringup_pkg runtime profile.
    - Interface transport health and downstream estimation quality are separate decisions.
  gps_blackout:
    expected_operating_condition: true
    gps_stale_or_no_fix_alone_requires_stop: false
    motion_requires_fresh_local_odometry: true
    motion_requires_localization_quality_within_approved_bounds: true
    last_gps_fix_must_not_be_reused_as_current_position_truth: true

contract_modules:
  package_registry:
    path: package_registry.yaml
    required_contract_version: 0.1.0
  tf:
    frame_contract: tf/frame_contract.yaml
    sensor_extrinsics: tf/sensor_extrinsics.yaml
    required_contract_version: 0.1.0
  timestamp:
    timestamp_contract: timestamp/timestamp_contract.yaml
    required_contract_version: 0.1.0
  morai_interface:
    udp_ros_bridge: morai_interface/udp_ros_bridge.yaml
    required_contract_version: 0.1.0

