  rotation_unit: rad
  rotation_order: fixed_axis_roll_pitch_yaw
  parent_frame: base_link
  assumption: >-
    MORAI sensor target pivot, translation axes, angle signs and rotation order
    map directly to the REP-103 base_link convention.
  assumption_verified: false

camera_optical_convention:
