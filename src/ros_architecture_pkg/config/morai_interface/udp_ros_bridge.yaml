    topic: /molit/sensors/lidar/points
    message_type: sensor_msgs/PointCloud2
    frame_id: lidar_link
    queue_size: external_driver_default_pending_measurement
    timestamp_source: source_measurement_packet
    configured_rate_hz: 10.0
  lidar_status:
    runtime_activation_allowed: false
    competition_runtime_status: development_diagnostic_only
    node_name: morai_lidar_watchdog
    input_topic: /molit/sensors/lidar/points
    topic: /molit/sensors/lidar/status
    message_type: std_msgs/Bool
    frame_id: not_applicable
    queue_size: 1
    timestamp_source: steady_watchdog_time
    configured_rate_hz: 2.0
    timeout_sec: 1.0
    limitation: Boolean status does not replace a structured transport health contract.

global_rules:
  - Bounding-box UDP packets are not published or used.
  - Static sensor TF remains disabled until the TF activation gates pass.
  - Receive-time fallback is captured immediately after recvfrom, not after parsing.
  - No ROS-to-MORAI control sender is part of this import.
  - No channel with runtime_activation_allowed false belongs in system bringup.
