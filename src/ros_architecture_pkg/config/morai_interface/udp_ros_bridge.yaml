    port_evidence: repository_sensor_reference_and_live_packet
    node_name: morai_camera_left
    topic: /molit/sensors/camera/left/image/compressed
    message_type: sensor_msgs/CompressedImage
    frame_id: camera_left_optical_frame
    queue_size: 2
    timestamp_source: source_measurement_packet
    timestamp_validation: reject_invalid_future_duplicate_or_regressing_stamp
