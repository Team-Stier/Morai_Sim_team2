schema_version: 1
contract_version: 0.1.0
status: development_partial_live_verification

authority:
  package: ros_architecture_pkg
  runtime_owner: morai_interface_pkg
  rule: >-
    Only channels marked runtime_activation_allowed may be launched during
    development. Competition use still requires the final official packet and
    network allowlist to match this contract.

source_import:
  repository: https://github.com/Team-Stier/Morai_Sim-Stier-Team2
  commit: f889f7f5ae47b51c4c5c0211c6a92a62398ca269
  upstream_package: morai_udp_bridge
  imported_python_namespace: morai_udp_bridge
  imported_scope:
    - camera_udp_to_compressed_image
    - gps_nmea_udp_to_nav_sat_fix
    - imu_udp_to_sensor_msgs_imu
    - legacy_ego_status_udp_to_twist
    - vlp16_external_driver_launch
    - lidar_points_watchdog
  deliberately_excluded:
    - ctrl_cmd_ros_to_udp
    - fake_udp_senders
    - fake_control_publisher
    - ego_ctrl_cmd_packet
    - udp_sender
  reason: This import is limited to MORAI-to-ROS sensor adapters.

