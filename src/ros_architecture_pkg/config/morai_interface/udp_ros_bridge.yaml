      The legacy parser reads fields absent from Competition Vehicle Status.
      Do not launch or use it until the official competition packet is matched.
  lidar:
    runtime_activation_allowed: false
    competition_runtime_status: pending_live_packet_port_axis_and_driver_verification
    transport: velodyne_vlp16_udp
    bind_ip: 0.0.0.0
    port: 2368
    port_evidence: imported_velodyne_example_not_live_verified
    nodelet_manager_name: morai_velodyne_manager
