  gps:
    runtime_activation_allowed: true
    competition_runtime_status: pending_final_network_confirmation
    transport: nmea_udp
    bind_ip: 0.0.0.0
    port: 7801
    port_evidence: live_packet
    node_name: morai_gps_bridge
    topic: /molit/sensors/gps/fix
    message_type: sensor_msgs/NavSatFix
    frame_id: gps_link
    queue_size: 10
    timestamp_source: morai_interface_ingress_time
