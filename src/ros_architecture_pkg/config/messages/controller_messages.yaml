schema_version: 1
contract_version: 0.1.0
authority: ros_architecture_pkg
implementation_owner: common_msgs_pkg
status: development_controller_not_driving_verified
runtime:
  control_rate_hz: 50.0
  status_rate_hz: 10.0
  input_queue_size: 2
  command_queue_size: 2
  status_queue_size: 1
  status_latched: true
messages:
  Trajectory:
    wire_definition: |
      # Schema authority: ros_architecture_pkg/config/messages/controller_messages.yaml
      # Planning reference time; frame_id must be odom. Forward motion only.
      std_msgs/Header header
      uint32 reset_id
      bool valid
      bool stop_required
      # Valid after header.stamp and strictly before header.stamp + valid_for.
      duration valid_for
      # Equal-sized ordered arrays; time starts at zero and strictly increases.
      geometry_msgs/Pose[] poses
      float64[] speed_mps
      duration[] time_from_start
  ControllerStatus:
    wire_definition: |
      # Schema authority: ros_architecture_pkg/config/messages/controller_messages.yaml
      uint8 STOP=0
      uint8 PURE_PURSUIT=1
      uint8 STANLEY=2
      uint8 DEGRADED=3
      # Evaluation time; frame_id is empty. Readiness is not permission to actuate.
      std_msgs/Header header
      bool ready
      bool stop_required
      bool command_valid
      uint8 mode
      uint32 reset_id
      time odometry_stamp
      time trajectory_stamp
      float64 target_speed_mps
      float64 speed_error_mps
      # PP: rear reference lateral error; Stanley: front axle directed path error.
      float64 cross_track_error_m
      float64 heading_error_rad
      bool saturated
      string reason
