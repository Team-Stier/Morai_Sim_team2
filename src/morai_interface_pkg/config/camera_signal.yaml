# Read-only projection of central Camera3 signal ingress, not Right Camera.
bind_ip: "0.0.0.0"
port: 9297
topic: "/molit/sensors/camera/signal/image/compressed"
frame_id: "camera_signal_optical_frame"
timestamp_source: "packet"
max_frame_bytes: 6000000
frame_timeout_sec: 0.5
check_chunk_index: true
receive_buffer_bytes: 65536
socket_timeout_sec: 0.5
stats_log_period_sec: 5.0
