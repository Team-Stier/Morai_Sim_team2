# Competition profile - Right Camera UDP ingress
# port는 현재 Team2 검증값이며 본선 현장 설정과 반드시 대조한다.
bind_ip: "0.0.0.0"
port: 9295
topic: "/molit/sensors/camera/right/image/compressed"
frame_id: "camera_right_optical_frame"
timestamp_source: "packet"
max_frame_bytes: 2000000
frame_timeout_sec: 0.5
check_chunk_index: true
receive_buffer_bytes: 65536
socket_timeout_sec: 0.5
stats_log_period_sec: 5.0
