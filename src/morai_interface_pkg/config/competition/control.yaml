# Competition profile - Ego Ctrl Cmd UDP egress
# Client PC Ethernet IPv4는 현재 대회 준비 설정(192.168.0.1)을 기본값으로 둔다.
# 현장 Client PC IP/port가 다르면 반드시 수정한다.
destination_ip: "192.168.0.1"
port: 7805

# 안전 기본값:
# - 노드는 competition.launch에서 올라오지만 live 검증 전 실제 UDP 제어는 송신하지 않는다.
# - steering 환산 검증 후 아래 3개 값을 본선 확정값으로 변경한다.
dry_run: true
allow_motion_commands: false
steering_conversion_verified: false
steering_normalized_per_rad: 1.0

max_command_age_sec: 0.25
future_tolerance_sec: 0.05
