# Six-state development estimator model parameters. Timing is read directly
# from ros_architecture_pkg/config/timestamp/timestamp_contract.yaml.
# The C++ diagnostic mode only uses status rate and clock stall.
status_publish_rate_hz: 10.0
clock_stall_sec: 0.5
gravity_mps2: 9.80665
gps_position_stddev_floor_m: 0.25
gps_altitude_stddev_floor_m: 0.5
orientation_stddev_floor_rad: 0.02
accelerometer_noise_stddev_mps2: 0.5
initial_velocity_stddev_mps: 2.0
gps_innovation_gate_chi2: 25.0
ingress_timing_stddev_sec: 0.03

# Sensor discontinuity heuristic for a stationary relocation (not a respawn event).
# Long GPS gaps break the evidence chain; do not relocalize on blackout return alone.
relocation:
  enabled: true
  min_jump_m: 15.0
  confirmation_samples: 5
  min_confirmation_sec: 0.6
  max_confirmation_sec: 2.0
  max_gps_gap_sec: 0.65
  cluster_radius_m: 1.5
  max_imu_displacement_m: 3.0
  max_linear_accel_mps2: 2.0
  max_angular_rate_radps: 0.5
  max_gps_stddev_m: 2.0
