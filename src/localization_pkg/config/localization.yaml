# Nine-state development estimator model parameters. Timing is read directly
# from ros_architecture_pkg/config/timestamp/timestamp_contract.yaml.
# The C++ diagnostic mode only uses status rate and clock stall.
status_publish_rate_hz: 10.0
clock_stall_sec: 0.5
gravity_mps2: 9.80665
gps_position_stddev_floor_m: 0.25
gps_altitude_stddev_floor_m: 0.5
orientation_stddev_floor_rad: 0.02
accelerometer_noise_stddev_mps2: 0.5
initial_velocity_stddev_mps: 2.0
# Above this value, immediately accept the GPS as a new map anchor and reset velocity.
gps_innovation_gate_chi2: 25.0
ingress_timing_stddev_sec: 0.03
# Body-frame additive residual acceleration (bias, not an attitude calibration).
initial_accelerometer_bias_stddev_mps2: 0.3
accelerometer_bias_random_walk_mps2_sqrt_sec: 0.005
# Soft zero-velocity updates require a contiguous GPS window AND quiet IMU.
# Applied once per accepted GPS only, never held/replayed through blackout.
stationary_window_sec: 2.0
stationary_gps_radius_m: 0.08
stationary_speed_mps: 0.15
stationary_acceleration_mps2: 0.15
stationary_angular_rate_radps: 0.02
stationary_velocity_stddev_mps: 0.10
stationary_gps_stddev_m: 0.6

# Source-backed, two-sided wall-normal aid. IMU remains the attitude observation.
wall_matching:
  enabled: true
  max_points: 2500
  min_height_m: 1.8
  max_height_m: 4.0
  max_range_m: 40.0
  association_distance_m: 1.5
  min_points_per_wall: 35
  min_span_m: 8.0
  max_heading_error_rad: 0.0872664626
  max_width_error_m: 0.70
  max_residual_m: 0.40
  max_correction_m: 1.2
  min_wall_length_m: 20.0
  innovation_gate_chi2: 16.0
