course_speed_policy: true  # Central config/map/course_speed_policy.yaml, also used by planning.

source:
  status: immutable_candidate
  repository: https://github.com/MORAI-Autonomous/verdict-sdk.git
  commit: fe27e92166513ac0c6c70a16d85212fc5f833fd3
  tree: b69c55ce910bfd4e17d709312d7ec47fde9d798e
  relative_path: vendor/verdict_sdk/map-data/KATRI
  expected_mgeo_major: 3
  license_status: upstream_metadata_says_MORAI_but_redistribution_terms_not_found

coordinates:
  utm_zone: 52
  northern_hemisphere: true
  # Captured from the running r_kr_pr_k-city_2025.scene instance.
  simulator_scene: r_kr_pr_k-city_2025.scene
  simulator_scene_origin_utm: [302595.0, 4124145.0, 0.0]

conversion:
  osm_generator: hd_map_pkg/mgeo3_lanelet2
  osm_version: "0.6"
  # Authoritative OSM keeps every source vertex; only the browser preview is simplified.
  geometry_simplification_m: 0.0
  viewer_simplification_m: 0.20
  # Keep nearby lanes available for on-site route adjustments while excluding
  # the rest of the K-City map from the browser preview.
  # This does not crop the authoritative Lanelet2 OSM or routing graph.
  viewer_route_crop_margin_m: 30.0
  # Preserve the continuous preview area from the route to these requested
  # northern road-border landmarks without changing their source geometry.
  viewer_crop_anchor_boundary_ids: [B2256W001824, B2256W000157]
  default_lane_width_m: 3.5
  traffic_light_bar_width_m: 0.6
  stop_line_search_radius_m: 40.0
  stop_line_intersection_tolerance_m: 0.75
  node_deduplication_m: 0.001
  deduplicate_verified_suffix_clones: true
  # Attribute changes become Lanelet segment boundaries. Nearby left/right
  # change events are merged to avoid centimetre-scale sliver lanelets.
  # KATRI has sub-0.5 m projection jitter where neighbouring boundary fragments
  # meet.  Clustering those events prevents zero-area sliver lanelets while the
  # immutable source ways remain exported at their exact coordinates.
  boundary_event_merge_tolerance_m: 0.50
  boundary_stitch_tolerance_m: 0.50
  minimum_lanelet_segment_length_m: 0.50
  endpoint_snap_taper_m: 10.0

lane_boundary:
  # NGII Model2 codes represented in this KATRI snapshot.
  stop_line_codes: [530]
  road_border_codes: [505, 531]
  centerline_codes: [501]
  thick_line_codes: [502]
  ordinary_lane_codes: [503, 504, 506, 515, 525]
  standalone_marking_codes: [535]

validation:
  max_boundary_to_center_distance_m: 30.0
  max_successor_endpoint_gap_m: 5.0
  segment_chainage_tolerance_m: 0.02
  max_derived_intersection_extent_m: 120.0
  require_every_link_in_routing_graph: true

references:
  simulator_scene_file: ../../참고파일들/2026_molit_comp_sample_scene.json
  simulator_global_path: ../../참고파일들/2026_molit_comp_global_path (3).txt

# Static alternatives only. Unknown/solid/compound/yellow boundaries fail closed.
lane_rddf:
  # User-requested derived geometry; does not create legal crossing permissions.
  course_connections:
    start_reference_link: A2256W000411
    end_reference_link: A2256W000423
    entry_blend_m: 80.0
    exit_blend_m: 45.0
    chains:
      - id: high_speed_inner
        link_ids: [A2256W000410, A2256W000430, A2256W000434, A2256W000422]
      - id: high_speed_outer
        link_ids: [A2256W000418, A2256W000431, A2256W000435, A2256W000423]
  allowed_link_ids: [A2256W000009, A2256W000307, A2256W000309, A2256W000310, A2256W000314, A2256W000319, A2256W000410, A2256W000418, A2256W000422, A2256W000423, A2256W000430, A2256W000431, A2256W000434, A2256W000435]
  # User-required intersection entry near checkpoint 8 (2026-09-21).
  # Exclude the outer bypass and its continuation, even if geometrically close to the course.
  excluded_link_ids: [A2256W000739, A2256W000849]
  sample_spacing_m: 0.5
  course_corridor_m: 15.0
  minimum_heading_dot: 0.8
  maximum_lane_width_m: 5.0
  maximum_height_difference_m: 1.5
  boundary_end_clearance_m: 3.0
  successor_gap_m: 0.5
  route_match_m: 0.8
  route_exclusion_m: 0.8
  minimum_run_m: 2.0

# Source wall polylines near the tunnel LCS01/LCS02. Heights are absent in MGeo.
# No route fitting or vehicle-pose anchoring is performed.
static_walls:
  source_object_ids: [C3256W000003, C3256W000005]
  horizontal_stddev_m: 0.40  # Development model floor; physical alignment unverified.
