# Diagnostic ground candidates selected ONCE in raw lidar_link, before rotation.
# This is separate from the object detector ROI and never changes detection.
roi_min: [2.0, -5.0, -3.0]
roi_max: [20.0, 5.0, -0.5]
max_points: 4000
ransac_iterations: 150
distance_threshold_m: 0.05
max_plane_tilt_deg: 30.0
min_inliers: 100
min_inlier_ratio: 0.45
min_x_span_m: 5.0
min_y_span_m: 3.0
seed: 42
